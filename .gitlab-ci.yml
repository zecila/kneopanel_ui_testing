workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - test
  - mutation

default:
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/junit.xml

typecheck:
  stage: verify
  script:
    - npm run typecheck

read-only-tests:
  stage: test
  needs:
    - typecheck
  script:
    - npm test -- --reporter=line,html,junit
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: test-results/junit.xml
    paths:
      - playwright-report/
      - test-results/

mutation-tests:
  stage: mutation
  needs:
    - read-only-tests
  interruptible: false
  resource_group: kneopanel-test-mutations
  variables:
    ALLOW_MUTATIONS: "true"
  script:
    - npm run test:mutating -- --reporter=line,html,junit
  environment:
    name: kneopanel-test-mutations
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: test-results/junit.xml
    paths:
      - playwright-report/
      - test-results/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

