workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - smoke
  - regression
  - mutation

default:
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/results.xml

.playwright-test:
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: test-results/results.xml
    paths:
      - playwright-report/
      - test-results/

typecheck:
  stage: verify
  script:
    - npm run typecheck

smoke-tests:
  extends: .playwright-test
  stage: smoke
  needs:
    - typecheck
  script:
    - npm run test:ci:smoke

read-only-regression:
  extends: .playwright-test
  stage: regression
  needs:
    - smoke-tests
  script:
    - npm run test:ci:regression
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - when: never

cross-browser-regression:
  extends: .playwright-test
  stage: regression
  needs:
    - read-only-regression
  script:
    - npm run test:ci:cross-browser
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

mutation-tests:
  extends: .playwright-test
  stage: mutation
  needs:
    - read-only-regression
  interruptible: false
  resource_group: kneopanel-test-mutations
  variables:
    ALLOW_MUTATIONS: "true"
  script:
    - npm run test:mutating
  environment:
    name: kneopanel-test-mutations
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true
